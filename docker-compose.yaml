version: "3.8"

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: blog_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: blog_db
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: blogpass123
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: blog_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: blog_app
    restart: always
    depends_on:
      - mysql
      - redis
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bloguser
      DB_PASSWORD: blogpass123
      DB_NAME: blog_db
      SECRET_KEY: your-super-secret-key-change-this
      TOKEN_EXPIRE: 30
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./uploads:/app/uploads
      - ./static:/app/static
    ports:
      - "8000:8000"

volumes:
  mysql_data:
  redis_data: