<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #666;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* 导航栏 */
        .navbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a, .nav-links button {
            text-decoration: none;
            color: var(--text-secondary);
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links button:hover {
            color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        .btn-primary {
            background: var(--primary) !important;
            color: white !important;
        }

        .btn-primary:hover {
            background: var(--primary-hover) !important;
        }

        /* 容器 */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* 页面切换 */
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 卡片 */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }

        input, textarea, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 200px;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: var(--border); color: var(--text); }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        /* 文章列表 */
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .post-item {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 8px;
        }

        .post-item:hover {
            background: rgba(79, 70, 229, 0.02);
        }

        .post-item:last-child { border-bottom: none; }

        .post-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .post-meta {
            color: var(--text-secondary);
            font-size: 0.875rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .category-tag {
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            padding: 1rem;
        }

        .pagination button {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            color: var(--text-secondary);
            font-size: 0.875rem;
            padding: 0 1rem;
        }

        .pagination .current-page {
            background: var(--primary) !important;
            color: white;
            border-color: var(--primary) !important;
        }

        /* 文章详情 */
        .post-detail h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .post-detail .meta {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .post-content {
            font-size: 1.125rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        /* 附件 */
        .attachment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .attachment-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--card);
        }

        .attachment-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .attachment-info {
            padding: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .attachment-delete {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 12px;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin: 1rem 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.02);
        }

        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s;
            box-shadow: var(--shadow);
        }

        .toast.success { background: #10b981; }
        .toast.error { background: var(--danger); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container { padding: 0 1rem; }
            .nav-links span { display: none; }
            .post-header { flex-direction: column; align-items: flex-start; }
            .filter-bar { width: 100%; }
            .filter-bar select { flex: 1; }
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
    <div class="nav-container">
        <div class="logo" onclick="router('home')">📚 我的博客</div>
        <div class="nav-links">
            <a href="#" onclick="router('home')">首页</a>
            <a href="#" onclick="router('new-post')" id="nav-new-post" style="display:none">写文章</a>
            <button onclick="router('login')" id="nav-login">登录</button>
            <button onclick="logout()" id="nav-logout" style="display:none">退出</button>
        </div>
    </div>
</nav>

<div class="container">

    <!-- 登录/注册页 -->
    <div id="page-auth" class="page">
        <div class="card" style="max-width: 400px; margin: 4rem auto;">
            <h2 id="auth-title">登录</h2>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="auth-username" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="auth-password" required placeholder="请输入密码">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%" id="auth-btn">登录</button>
            </form>
            <p style="text-align:center; margin-top:1rem; color:var(--text-secondary)">
                <span id="auth-toggle-text">还没有账号？</span>
                <a href="#" onclick="toggleAuthMode()" id="auth-toggle-link">去注册</a>
            </p>
        </div>
    </div>

    <!-- 文章列表页 -->
    <div id="page-home" class="page active">
        <div class="post-header">
            <h1>文章列表</h1>
            <div class="filter-bar">
                <select id="category-filter" onchange="loadPosts(1)">
                    <option value="">全部分类</option>
                </select>
                <button class="btn btn-primary" onclick="router('new-post')" id="btn-new-post" style="display:none">+ 写文章</button>
            </div>
        </div>
        <div id="posts-container">
            <div class="loading"><div class="spinner"></div> 加载中...</div>
        </div>
        <div class="pagination" id="pagination" style="display:none"></div>
    </div>

    <!-- 文章详情页 -->
    <div id="page-detail" class="page">
        <div class="card post-detail">
            <div id="post-content-area">
                <div class="loading"><div class="spinner"></div> 加载中...</div>
            </div>
        </div>

        <!-- 附件区域 -->
        <div class="card" id="attachments-section" style="display:none">
            <h3>📎 附件</h3>
            <div id="attachments-list" class="attachment-grid"></div>
            <div class="pagination" id="attach-pagination" style="display:none"></div>
        </div>
    </div>

    <!-- 创建/编辑文章页 -->
    <div id="page-editor" class="page">
        <div class="card">
            <h2 id="editor-title">写文章</h2>
            <form id="post-form" onsubmit="savePost(event)">
                <input type="hidden" id="post-id">
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="post-title" required placeholder="请输入文章标题">
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="post-category">
                        <option value="">选择分类</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>内容</label>
                    <textarea id="post-content" required placeholder="支持 Markdown 格式..."></textarea>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">保存文章</button>
                    <button type="button" class="btn btn-secondary" onclick="router('home')">取消</button>
                </div>
            </form>
        </div>

        <!-- 图片上传（仅编辑模式显示） -->
        <div class="card" id="upload-section" style="display:none">
            <h3>📤 上传图片</h3>
            <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
                <p>点击或拖拽图片到此处上传</p>
                <p style="font-size:0.875rem; color:var(--text-secondary); margin-top:0.5rem">支持 JPG、PNG、GIF、WebP，最大 5MB</p>
            </div>
            <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileSelect(event)">

            <h4 style="margin-top:1.5rem">已上传图片</h4>
            <div id="editor-attachments" class="attachment-grid"></div>
        </div>
    </div>

</div>

<script>
// ==================== 配置 ====================
const API_BASE = 'http://localhost:8000';  // 修改为你的后端地址
let currentToken = localStorage.getItem('token') || null;
let currentUser = null;
let authMode = 'login'; // 'login' 或 'register'
let postsCache = { data: [], total: 0 };
let currentPostId = null;

// ==================== 工具函数 ====================
function $(id) { return document.getElementById(id); }

function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

async function api(url, options = {}) {
    const opts = {
        headers: {
            'Accept': 'application/json',
            ...(options.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }),
            ...(currentToken ? { 'Authorization': `Bearer ${currentToken}` } : {})
        },
        ...options
    };

    try {
        const res = await fetch(API_BASE + url, opts);
        const data = res.headers.get('content-type')?.includes('json') ? await res.json() : null;

        if (!res.ok) {
            throw new Error(data?.detail || `请求失败: ${res.status}`);
        }
        return data;
    } catch (err) {
        showToast(err.message, 'error');
        throw err;
    }
}

// ==================== 路由 ====================
function router(page, param = null) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

    switch(page) {
        case 'home':
            $('page-home').classList.add('active');
            loadPosts(1);
            loadCategories();
            break;
        case 'login':
            $('page-auth').classList.add('active');
            break;
        case 'detail':
            $('page-detail').classList.add('active');
            loadPostDetail(param);
            break;
        case 'new-post':
            if (!currentToken) { router('login'); return; }
            $('page-editor').classList.add('active');
            $('editor-title').textContent = '写文章';
            $('post-form').reset();
            $('post-id').value = '';
            $('upload-section').style.display = 'none';
            loadCategoriesForSelect();
            break;
        case 'edit-post':
            if (!currentToken) { router('login'); return; }
            $('page-editor').classList.add('active');
            $('editor-title').textContent = '编辑文章';
            loadPostForEdit(param);
            break;
    }

    updateNav();
}

function updateNav() {
    const isLogin = !!currentToken;
    $('nav-login').style.display = isLogin ? 'none' : 'inline-block';
    $('nav-logout').style.display = isLogin ? 'inline-block' : 'none';
    $('nav-new-post').style.display = isLogin ? 'inline-block' : 'none';
    $('btn-new-post').style.display = isLogin ? 'inline-block' : 'none';
}

// ==================== 认证 ====================
function toggleAuthMode() {
    authMode = authMode === 'login' ? 'register' : 'login';
    $('auth-title').textContent = authMode === 'login' ? '登录' : '注册';
    $('auth-btn').textContent = authMode === 'login' ? '登录' : '注册';
    $('auth-toggle-text').textContent = authMode === 'login' ? '还没有账号？' : '已有账号？';
    $('auth-toggle-link').textContent = authMode === 'login' ? '去注册' : '去登录';
}

async function handleAuth(e) {
    e.preventDefault();
    const username = $('auth-username').value;
    const password = $('auth-password').value;

    try {
        if (authMode === 'register') {
            await api('/register', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            showToast('注册成功，请登录');
            toggleAuthMode();
        } else {
            // 登录使用 form-data（OAuth2PasswordRequestForm）
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            const data = await api('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            currentToken = data.access_token;
            localStorage.setItem('token', currentToken);
            showToast('登录成功');
            router('home');
        }
    } catch (err) {
        // 错误已在 api() 中提示
    }
}

function logout() {
    currentToken = null;
    localStorage.removeItem('token');
    showToast('已退出登录');
    router('home');
}

// ==================== 分类 ====================
async function loadCategories() {
    try {
        const cats = await api('/categories');
        const select = $('category-filter');
        select.innerHTML = '<option value="">全部分类</option>';
        cats.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        });
    } catch (e) {}
}

async function loadCategoriesForSelect() {
    try {
        const cats = await api('/categories');
        const select = $('post-category');
        select.innerHTML = '<option value="">选择分类</option>';
        cats.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        });
    } catch (e) {}
}

// ==================== 文章列表 ====================
async function loadPosts(page = 1) {
    const limit = 10;
    const skip = (page - 1) * limit;
    const categoryId = $('category-filter').value;

    let url = `/posts?skip=${skip}&limit=${limit}`;
    if (categoryId) url += `&category_id=${categoryId}`;

    try {
        const data = await api(url);
        postsCache = data;
        renderPosts(data.data);
        renderPagination(data.total, limit, page, 'pagination', loadPosts);
    } catch (e) {
        $('posts-container').innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

function renderPosts(posts) {
    const container = $('posts-container');
    if (!posts || posts.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <p>暂无文章</p>
            </div>`;
        return;
    }

    container.innerHTML = posts.map(post => `
        <div class="post-item" onclick="router('detail', ${post.id})">
            <div class="post-title">${escapeHtml(post.title)}</div>
            <div class="post-meta">
                <span>👤 ${escapeHtml(post.author)}</span>
                <span>📅 ${formatDate(post.created_at)}</span>
                ${post.category_name ? `<span class="category-tag">${escapeHtml(post.category_name)}</span>` : ''}
            </div>
        </div>
    `).join('');
}

// ==================== 分页组件 ====================
function renderPagination(total, limit, currentPage, containerId, callback) {
    const totalPages = Math.ceil(total / limit);
    const container = $(containerId);

    if (totalPages <= 1) {
        container.style.display = 'none';
        return;
    }
    container.style.display = 'flex';

    let html = `<button onclick="${callback.name}(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;

    // 显示页码，最多显示5个
    let start = Math.max(1, currentPage - 2);
    let end = Math.min(totalPages, start + 4);
    if (end - start < 4) start = Math.max(1, end - 4);

    for (let i = start; i <= end; i++) {
        html += `<button onclick="${callback.name}(${i})" class="${i === currentPage ? 'current-page' : ''}">${i}</button>`;
    }

    html += `<button onclick="${callback.name}(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
    html += `<span class="page-info">共 ${total} 条，${totalPages} 页</span>`;

    container.innerHTML = html;
}

// ==================== 文章详情 ====================
async function loadPostDetail(postId) {
    currentPostId = postId;
    $('post-content-area').innerHTML = '<div class="loading"><div class="spinner"></div> 加载中...</div>';
    $('attachments-section').style.display = 'none';

    try {
        const post = await api(`/posts/${postId}`);
        // 注意后端返回的是数组或对象，兼容处理
        const data = Array.isArray(post) ? post[0] : post;

        const isOwner = currentUser && data.user_id === currentUser.id;

        $('post-content-area').innerHTML = `
            <h1>${escapeHtml(data.title)}</h1>
            <div class="meta">
                <span>👤 ${escapeHtml(data.author)}</span>
                <span>📅 ${formatDate(data.created_at)}</span>
                ${data.category_name ? `<span class="category-tag">${escapeHtml(data.category_name)}</span>` : ''}
                ${currentToken ? `
                    <span style="margin-left:auto">
                        <button class="btn btn-secondary" onclick="event.stopPropagation(); router('edit-post', ${data.id})" style="padding:0.25rem 0.75rem; font-size:0.875rem">编辑</button>
                        <button class="btn btn-danger" onclick="event.stopPropagation(); deletePost(${data.id})" style="padding:0.25rem 0.75rem; font-size:0.875rem; margin-left:0.5rem">删除</button>
                    </span>
                ` : ''}
            </div>
            <div class="post-content">${escapeHtml(data.content)}</div>
        `;

        // 加载附件
        loadAttachments(postId, 1);
        $('attachments-section').style.display = 'block';
    } catch (e) {
        $('post-content-area').innerHTML = '<div class="empty-state">文章不存在或加载失败</div>';
    }
}

async function deletePost(postId) {
    if (!confirm('确定要删除这篇文章吗？')) return;
    try {
        await api(`/posts/${postId}`, { method: 'DELETE' });
        showToast('删除成功');
        router('home');
    } catch (e) {}
}

// ==================== 编辑器 ====================
async function loadPostForEdit(postId) {
    try {
        const post = await api(`/posts/${postId}`);
        const data = Array.isArray(post) ? post[0] : post;

        $('post-id').value = data.id;
        $('post-title').value = data.title;
        $('post-content').value = data.content;

        await loadCategoriesForSelect();
        $('post-category').value = data.category_id || '';

        $('upload-section').style.display = 'block';
        loadEditorAttachments(postId, 1);
    } catch (e) {
        showToast('加载文章失败', 'error');
    }
}

async function savePost(e) {
    e.preventDefault();
    const postId = $('post-id').value;
    const payload = {
        title: $('post-title').value,
        content: $('post-content').value,
        category_id: $('post-category').value ? parseInt($('post-category').value) : null
    };

    try {
        if (postId) {
            await api(`/posts/${postId}`, {
                method: 'PUT',
                body: JSON.stringify(payload)
            });
            showToast('更新成功');
            router('detail', parseInt(postId));
        } else {
            const res = await api('/posts', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            showToast('发布成功');
            router('detail', res.id);
        }
    } catch (e) {}
}

// ==================== 附件管理 ====================
async function loadAttachments(postId, page = 1) {
    const limit = 8;
    const skip = (page - 1) * limit;

    try {
        const data = await api(`/post/${postId}/attachments?skip=${skip}&limit=${limit}`);
        const container = $('attachments-list');

        if (!data.data || data.data.length === 0) {
            container.innerHTML = '<p style="color:var(--text-secondary); grid-column:1/-1">暂无附件</p>';
            $('attach-pagination').style.display = 'none';
            return;
        }

        container.innerHTML = data.data.map(att => `
            <div class="attachment-item">
                <img src="${API_BASE}${att.url}" alt="${escapeHtml(att.original_name)}"
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23999%22 stroke-width=%222%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22/><circle cx=%228.5%22 cy=%228.5%22 r=%221.5%22/><path d=%22M21 15l-5-5L5 21%22/></svg>'">
                <div class="attachment-info">${escapeHtml(att.original_name)}<br>${formatSize(att.file_size)}</div>
            </div>
        `).join('');

        renderPagination(data.total, limit, page, 'attach-pagination', (p) => loadAttachments(postId, p));
    } catch (e) {}
}

async function loadEditorAttachments(postId, page = 1) {
    const limit = 8;
    const skip = (page - 1) * limit;

    try {
        const data = await api(`/post/${postId}/attachments?skip=${skip}&limit=${limit}`);
        const container = $('editor-attachments');

        if (!data.data || data.data.length === 0) {
            container.innerHTML = '<p style="color:var(--text-secondary); grid-column:1/-1">暂无图片</p>';
            return;
        }

        container.innerHTML = data.data.map(att => `
            <div class="attachment-item">
                <button class="attachment-delete" onclick="deleteAttachment(${att.id})" title="删除">×</button>
                <img src="${API_BASE}${att.url}" alt="${escapeHtml(att.original_name)}"
                     onerror="this.style.display='none'">
                <div class="attachment-info">${escapeHtml(att.original_name)}<br>${formatSize(att.file_size)}</div>
            </div>
        `).join('');
    } catch (e) {}
}

async function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file || !currentPostId) return;

    const formData = new FormData();
    formData.append('file', file);

    try {
        await api(`/post/${currentPostId}/upload`, {
            method: 'POST',
            body: formData
        });
        showToast('上传成功');
        loadEditorAttachments(currentPostId, 1);
        // 刷新详情页附件
        if ($('page-detail').classList.contains('active')) {
            loadAttachments(currentPostId, 1);
        }
    } catch (e) {}
}

async function deleteAttachment(attachmentId) {
    if (!confirm('确定删除这张图片吗？')) return;
    try {
        await api(`/attachments/${attachmentId}`, { method: 'DELETE' });
        showToast('删除成功');
        loadEditorAttachments(currentPostId, 1);
    } catch (e) {}
}

// 拖拽上传
$('upload-area').addEventListener('dragover', (e) => {
    e.preventDefault();
    e.currentTarget.classList.add('dragover');
});
$('upload-area').addEventListener('dragleave', (e) => {
    e.currentTarget.classList.remove('dragover');
});
$('upload-area').addEventListener('drop', (e) => {
    e.preventDefault();
    e.currentTarget.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0) {
        const input = $('file-input');
        const dt = new DataTransfer();
        dt.items.add(files[0]);
        input.files = dt.files;
        handleFileSelect({ target: input });
    }
});

// ==================== 工具函数 ====================
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return d.toLocaleString('zh-CN');
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

// ==================== 初始化 ====================
if (currentToken) {
    // 尝试解析用户信息（简单处理）
    try {
        const payload = JSON.parse(atob(currentToken.split('.')[1]));
        currentUser = { id: payload.sub }; // 实际应该用 sub 或 user_id
    } catch (e) {}
}

router('home');
</script>
